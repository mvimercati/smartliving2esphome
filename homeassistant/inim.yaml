# Home Assistant side of the ESPHome firmware esphome/inim.yaml (INIM SmartLiving 1050).
#
# The ESP publishes the panel states; the alarm panels and locks below ask for the PIN and pass it
# to the ESP actions (esphome.inim_rs232_*): the PIN is never stored. They keep the entity ids of
# the former MQTT bridge (default_entity_id), so automations, dashboards and history carry on.
#
# Installed as a package, in configuration.yaml:
#   homeassistant:
#     packages:
#       inim: !include packages/inim.yaml
#
# The area panels and zone locks share the settings of the first one of their list (YAML anchor)
# and differ only in name, ids and number (variables).

template:
  - variables:
      # INIM arm mode of an area, as shown to the user, and its icon
      mode_text:
        armed_away: Inserita  # with entry/exit delays
        armed_home: Parziale
        armed_night: Immediata  # no delay: alarm right away
        disarmed: Disinserita
        triggered: In allarme
        pending: In corso
      mode_icon:
        armed_away: mdi:shield-lock
        armed_home: mdi:shield-half-full
        armed_night: mdi:shield-alert
        disarmed: mdi:shield-off-outline
        triggered: mdi:alarm-light
      pin_format: "^[0-9]{1,6}$"

    alarm_control_panel:
      # Panel scenarios
      - name: Antifurto
        unique_id: inim_alarm
        default_entity_id: alarm_control_panel.mqtt_alarm
        state: "{{ states('sensor.inim_stato_antifurto') }}"
        availability: "{{ is_state('binary_sensor.inim_connessione', 'on') }}"
        code_format: number
        code_arm_required: true
        arm_away:
          action: esphome.inim_rs232_arm
          data: {scenario: armed_away, pin: "{{ code }}"}
        arm_home:
          action: esphome.inim_rs232_arm
          data: {scenario: armed_home, pin: "{{ code }}"}
        arm_night:
          action: esphome.inim_rs232_arm
          data: {scenario: armed_night, pin: "{{ code }}"}
        disarm:
          action: esphome.inim_rs232_arm
          data: {scenario: disarmed, pin: "{{ code }}"}

      # Single areas: away = Inserita, home = Parziale, night = Immediata
      - name: "Area 0: Finestra Taverna"
        unique_id: inim_area_0
        default_entity_id: alarm_control_panel.area_0_finestra_taverna
        variables: {area: 0}
        <<: &area_panel
          state: "{{ states('sensor.inim_stato_area_' ~ area) }}"
          icon: "{{ mode_icon.get(states('sensor.inim_stato_area_' ~ area), 'mdi:shield-off-outline') }}"
          attributes:
            modalita: "{{ mode_text.get(states('sensor.inim_stato_area_' ~ area), '') }}"
          availability: "{{ is_state('binary_sensor.inim_connessione', 'on') }}"
          code_format: number
          code_arm_required: true
          arm_away:
            action: esphome.inim_rs232_arm_area
            data: {area: "{{ area }}", mode: armed_away, pin: "{{ code }}"}
          arm_home:
            action: esphome.inim_rs232_arm_area
            data: {area: "{{ area }}", mode: armed_home, pin: "{{ code }}"}
          arm_night:
            action: esphome.inim_rs232_arm_area
            data: {area: "{{ area }}", mode: armed_night, pin: "{{ code }}"}
          disarm:
            action: esphome.inim_rs232_arm_area
            data: {area: "{{ area }}", mode: disarmed, pin: "{{ code }}"}
      - name: "Area 1: Finestre Piano 1"
        unique_id: inim_area_1
        default_entity_id: alarm_control_panel.area_1_finestre_piano_1
        variables: {area: 1}
        <<: *area_panel
      - name: "Area 2: Finestre Piano 2"
        unique_id: inim_area_2
        default_entity_id: alarm_control_panel.area_2_finestre_piano_2
        variables: {area: 2}
        <<: *area_panel
      - name: "Area 3: Porta Blindata"
        unique_id: inim_area_3
        default_entity_id: alarm_control_panel.area_3_porta_blindata
        variables: {area: 3}
        <<: *area_panel
      - name: "Area 4: Porta Box"
        unique_id: inim_area_4
        default_entity_id: alarm_control_panel.area_4_porta_box
        variables: {area: 4}
        <<: *area_panel
      - name: "Area 5: Radar Piano 1"
        unique_id: inim_area_5
        default_entity_id: alarm_control_panel.area_5_radar_piano_1
        variables: {area: 5}
        <<: *area_panel
      - name: "Area 6: Radar Taverna"
        unique_id: inim_area_6
        default_entity_id: alarm_control_panel.area_6_radar_taverna
        variables: {area: 6}
        <<: *area_panel
      - name: "Area 7: Radar Box"
        unique_id: inim_area_7
        default_entity_id: alarm_control_panel.area_7_radar_box
        variables: {area: 7}
        <<: *area_panel

    lock:
      # Zone bypass: locked = zone protected (included), unlocked = excluded
      - name: Protezione Finestra bagno p2
        unique_id: inim_bypass_zone_0
        default_entity_id: lock.protezione_finestra_bagno_p2
        variables: {zone: 0}
        <<: &zone_lock
          state: "{{ 'unlocked' if is_state('binary_sensor.inim_esclusione_zona_' ~ zone, 'on') else 'locked' }}"
          availability: "{{ is_state('binary_sensor.inim_connessione', 'on') }}"
          code_format: "{{ pin_format }}"
          lock:
            action: esphome.inim_rs232_bypass_zone
            data: {zone: "{{ zone }}", exclude: false, pin: "{{ code }}"}
          unlock:
            action: esphome.inim_rs232_bypass_zone
            data: {zone: "{{ zone }}", exclude: true, pin: "{{ code }}"}
      - name: Protezione Finestra camera Giulia
        unique_id: inim_bypass_zone_1
        default_entity_id: lock.protezione_finestra_camera_giulia
        variables: {zone: 1}
        <<: *zone_lock
      - name: Protezione Finestra camera matrimoniale
        unique_id: inim_bypass_zone_2
        default_entity_id: lock.protezione_finestra_camera_matrimoniale
        variables: {zone: 2}
        <<: *zone_lock
      - name: Protezione Finestra camera Sofia
        unique_id: inim_bypass_zone_3
        default_entity_id: lock.protezione_finestra_camera_sofia
        variables: {zone: 3}
        <<: *zone_lock
      - name: Protezione Radar cucina
        unique_id: inim_bypass_zone_4
        default_entity_id: lock.protezione_radar_cucina
        variables: {zone: 4}
        <<: *zone_lock
      - name: Protezione Radar sala
        unique_id: inim_bypass_zone_5
        default_entity_id: lock.protezione_radar_sala
        variables: {zone: 5}
        <<: *zone_lock
      - name: Protezione Finestra bagno p1
        unique_id: inim_bypass_zone_10
        default_entity_id: lock.protezione_finestra_bagno_p1
        variables: {zone: 10}
        <<: *zone_lock
      - name: Protezione Finestra sala sx
        unique_id: inim_bypass_zone_11
        default_entity_id: lock.protezione_finestra_sala_sx
        variables: {zone: 11}
        <<: *zone_lock
      - name: Protezione Finestra cucina
        unique_id: inim_bypass_zone_12
        default_entity_id: lock.protezione_finestra_cucina
        variables: {zone: 12}
        <<: *zone_lock
      - name: Protezione Finestra sala dx
        unique_id: inim_bypass_zone_13
        default_entity_id: lock.protezione_finestra_sala_dx
        variables: {zone: 13}
        <<: *zone_lock
      - name: Protezione Radar taverna
        unique_id: inim_bypass_zone_15
        default_entity_id: lock.protezione_radar_taverna
        variables: {zone: 15}
        <<: *zone_lock
      - name: Protezione Radar box
        unique_id: inim_bypass_zone_16
        default_entity_id: lock.protezione_radar_box
        variables: {zone: 16}
        <<: *zone_lock
      - name: Protezione Blindata ingresso
        unique_id: inim_bypass_zone_17
        default_entity_id: lock.protezione_blindata_ingresso
        variables: {zone: 17}
        <<: *zone_lock
      - name: Protezione Porta box
        unique_id: inim_bypass_zone_18
        default_entity_id: lock.protezione_porta_box
        variables: {zone: 18}
        <<: *zone_lock
      - name: Protezione Finestra taverna
        unique_id: inim_bypass_zone_19
        default_entity_id: lock.protezione_finestra_taverna
        variables: {zone: 19}
        <<: *zone_lock

      # Unlocked = some zone is excluded; locking (with the code) includes them all
      - name: Esclusioni zone
        unique_id: inim_bypassed_zones
        default_entity_id: lock.inim_esclusioni_zone
        icon: mdi:shield-sync
        state: "{{ 'unlocked' if is_state('binary_sensor.inim_zone_escluse', 'on') else 'locked' }}"
        availability: "{{ is_state('binary_sensor.inim_connessione', 'on') }}"
        code_format: "{{ pin_format }}"
        lock:
          action: esphome.inim_rs232_include_all
          data: {pin: "{{ code }}"}
        unlock: []  # nothing to do

      # Unlocked = some area has alarm or tamper memory; locking (with the code) resets them
      - name: Memorie allarme
        unique_id: inim_memories
        default_entity_id: lock.inim_memorie_allarme
        icon: mdi:history
        state: >-
          {{ 'unlocked' if is_state('binary_sensor.inim_memoria_allarme', 'on')
             or is_state('binary_sensor.inim_memoria_sabotaggio', 'on') else 'locked' }}
        availability: "{{ is_state('binary_sensor.inim_connessione', 'on') }}"
        code_format: "{{ pin_format }}"
        lock:
          action: esphome.inim_rs232_reset_memory
          data: {pin: "{{ code }}"}
        unlock: []  # nothing to do
