  - type: tile
    entity: binary_sensor.inim_sabotaggio
    name: Sabotaggio
  - type: tile
    entity: sensor.inim_psu_voltage
    name: Alimentatore
  - type: tile
    entity: sensor.battery_voltage
    name: Batteria
  - type: heading
    heading: Guasti
    heading_style: subtitle
    badges:
    - type: entity
      entity: input_boolean.mostra_dettagli_guasti
      name: Dettagli
      icon: mdi:format-list-bulleted
      show_state: false
      show_icon: true
      color: blue
      tap_action:
        action: toggle
  - type: markdown
    content: |-
      {%- set labels = {
        'fault_mains': 'Mancanza rete', 'fault_battery': 'Batteria inefficiente',
        'fuse_zones': 'Fusibile zone', 'fuse_ibus': 'Fusibile I-BUS',
        'fault_phone': 'Linea telefonica', 'fault_gsm': 'Modulo GSM (Nexus)', 'fault_jamming': 'Disturbo radio (jamming)',
        'fault_radio_battery': 'Batteria sensori radio', 'fault_radio_loss': 'Perdita sensori radio',
        'tamper_panel': 'Sabotaggio centrale', 'tamper_cover': 'Coperchio centrale aperto',
        'tamper_reader': 'Sabotaggio lettori', 'tamper_keypad': 'Sabotaggio tastiere',
        'tamper_expander': 'Sabotaggio espansioni' } -%}
      {%- set info = { 'service': 'Manutenzione', 'program': 'Programmazione', 'reset': 'Reset',
        'internet': 'Internet', 'voice': 'Vocale' } -%}
      {%- set ns = namespace(on=[], info=[]) -%}
      {%- for k, v in labels.items() if is_state('binary_sensor.inim_' ~ k, 'on') %}{% set ns.on = ns.on + [v] %}{% endfor -%}
      {%- for k, v in info.items() if is_state('binary_sensor.inim_' ~ k, 'on') %}{% set ns.info = ns.info + [v] %}{% endfor -%}
      {%- if ns.on %}⚠️ **{{ ns.on | join(' · ') }}**{% else %}✅ Nessun guasto o sabotaggio della centrale{% endif %}
      {%- if ns.info %}

      ℹ️ {{ ns.info | join(' · ') }}{% endif %}
    grid_options:
      columns: 12
  - color: state
    type: entities
