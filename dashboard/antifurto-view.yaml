# Home Assistant view for the alarm (sections layout), as installed in the main dashboard.
# Usage: dashboard -> edit -> the "Antifurto" view -> "Edit in YAML" (⋮) -> paste this file.
# - zones: tap = details, tap on the icon (or hold) = exclusion (asks for the code);
#   an excluded zone is shown by a red "· esclusa" tile instead of the normal one
# - header badges appear only when something needs attention (excluded zones, alarm, faults...)
# - fault bits list: shown/hidden by the "Dettagli" badge (helper input_boolean.mostra_dettagli_guasti,
#   create it in HA: Settings > Devices > Helpers > Toggle)
title: Antifurto
path: antifurto-v3
icon: mdi:shield-home
type: sections
max_columns: 4
sections:
- type: grid
  cards:
  - type: heading
    heading: Antifurto
    heading_style: title
    icon: mdi:shield-home
    badges:
    - type: entity
      entity: binary_sensor.inim_connessione
      name: Centrale
      show_state: true
      show_icon: true
      color: green
      visibility:
      - condition: state
        entity: binary_sensor.inim_connessione
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_connessione
      name: Centrale non raggiungibile
      show_state: false
      show_icon: true
      color: red
      visibility:
      - condition: state
        entity: binary_sensor.inim_connessione
        state_not: 'on'
    - type: entity
      entity: alarm_control_panel.mqtt_alarm
      name: Allarme in corso
      color: red
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: alarm_control_panel.mqtt_alarm
        state: triggered
    - type: entity
      entity: binary_sensor.inim_sabotaggio
      name: Sabotaggio
      color: red
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_sabotaggio
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_memoria_allarme
      name: Memoria allarme
      color: orange
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_memoria_allarme
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_memoria_sabotaggio
      name: Memoria sabotaggio
      color: orange
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_memoria_sabotaggio
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_guasto
      name: Guasto
      color: amber
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_guasto
        state: 'on'
    - type: entity
      entity: button.inim_refresh
      name: Aggiorna
      icon: mdi:refresh
      show_state: false
      show_icon: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.inim_refresh
  - type: tile
    entity: alarm_control_panel.mqtt_alarm
    name: Antifurto
    grid_options:
      columns: 12
    features:
    - type: alarm-modes
      modes:
      - disarmed
      - armed_home
      - armed_night
      - armed_away
  - type: tile
