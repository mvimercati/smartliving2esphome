    - entity: binary_sensor.inim_smartliving_1050_manutenzione
      name: Manutenzione
    - entity: binary_sensor.inim_smartliving_1050_programmazione
      name: Programmazione
    - entity: binary_sensor.inim_smartliving_1050_vocale
      name: Vocale
    grid_options:
      columns: 12
    visibility:
    - condition: state
      entity: input_boolean.mostra_dettagli_guasti
      state: 'on'
  - type: heading
    heading: Convertitore
    heading_style: subtitle
    icon: mdi:chip
  - type: tile
