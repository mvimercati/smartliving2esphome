    - entity: binary_sensor.inim_smartliving_1050_jamming_radio
      name: Jamming radio
    - entity: binary_sensor.inim_smartliving_1050_batteria_sensori_radio
      name: Batteria sensori radio
    - entity: binary_sensor.inim_smartliving_1050_perdita_sensori_radio
      name: Perdita sensori radio
    - type: section
