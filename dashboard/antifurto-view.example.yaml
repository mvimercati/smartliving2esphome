# Home Assistant view for the alarm (sections layout), for the example installation
# (esphome/installation.example.yaml, homeassistant/inim.example.yaml).
# Usage: dashboard -> add a view -> "Edit in YAML" (⋮) -> paste this file.
# - zones: tap = details, tap on the icon (or hold) = exclusion (asks for the code);
#   an excluded zone is shown by a red "· esclusa" tile instead of the normal one
# - header badges appear only when something needs attention (excluded zones, alarm, faults...)
# - fault bits list: shown/hidden by the "Dettagli" badge (helper input_boolean.mostra_dettagli_guasti,
#   create it in HA: Settings > Devices > Helpers > Toggle)
title: Antifurto
path: antifurto
icon: mdi:shield-home
type: sections
max_columns: 4
sections:
- type: grid
  cards:
  - type: heading
    heading: Antifurto
    heading_style: title
    icon: mdi:shield-home
    badges:
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_connessione_centrale
      name: Centrale
      show_state: true
      show_icon: true
      color: green
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_connessione_centrale
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_connessione_centrale
      name: Centrale non raggiungibile
      show_state: false
      show_icon: true
      color: red
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_connessione_centrale
        state_not: 'on'
    - type: entity
      entity: alarm_control_panel.antifurto
      name: Allarme in corso
      color: red
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: alarm_control_panel.antifurto
        state: triggered
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_sabotaggio
      name: Sabotaggio
      color: red
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_sabotaggio
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_memoria_allarme
      name: Memoria allarme
      color: orange
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_memoria_allarme
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_memoria_sabotaggio
      name: Memoria sabotaggio
      color: orange
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_memoria_sabotaggio
        state: 'on'
    - type: entity
      entity: binary_sensor.inim_smartliving_1050_guasto
      name: Guasto
      color: amber
      show_state: false
      show_icon: true
      tap_action:
        action: more-info
      visibility:
      - condition: state
        entity: binary_sensor.inim_smartliving_1050_guasto
        state: 'on'
    - type: entity
      entity: button.inim_smartliving_1050_refresh
      name: Aggiorna
      icon: mdi:refresh
      show_state: false
      show_icon: true
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.inim_smartliving_1050_refresh
  - type: tile
    entity: alarm_control_panel.antifurto
    name: Antifurto
    grid_options:
      columns: 12
    features:
    - type: alarm-modes
      modes:
      - disarmed
      - armed_home
      - armed_night
      - armed_away
  - type: tile
    entity: sensor.inim_smartliving_1050_zone_in_allarme
    name: Allarme da
    icon: mdi:alarm-light
    color: red
    grid_options:
      columns: 12
    tap_action:
      action: more-info
      entity: lock.memorie_allarme
    visibility:
    - condition: state
      entity: sensor.inim_smartliving_1050_zone_in_allarme
      state_not: Nessuna
  - type: tile
    entity: sensor.inim_smartliving_1050_ultimo_evento
    name: Ultimo evento
    icon: mdi:history
    state_content:
    - state
    - last_changed
    grid_options:
      columns: 12
  - type: tile
    entity: lock.memorie_allarme
    name: Reset memorie
    icon: mdi:history
    state_content: state
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: lock.esclusioni_zone
    name: Annulla esclusioni
    icon: mdi:shield-sync
    state_content: state
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: heading
    heading: Centrale
    heading_style: title
    icon: mdi:alarm-panel-outline
  - type: tile
    entity: sensor.inim_smartliving_1050_last_write_result
    name: Ultimo comando
  - type: tile
    entity: binary_sensor.inim_smartliving_1050_memoria_allarme
    name: Memoria allarme
  - type: tile
    entity: binary_sensor.inim_smartliving_1050_memoria_sabotaggio
    name: Memoria sabotaggio
  - type: tile
    entity: binary_sensor.inim_smartliving_1050_sabotaggio
    name: Sabotaggio
  - type: tile
    entity: sensor.inim_smartliving_1050_psu_voltage
    name: Alimentatore
  - type: tile
    entity: sensor.inim_smartliving_1050_battery_voltage
    name: Batteria
  - type: heading
    heading: Guasti
    heading_style: subtitle
    badges:
    - type: entity
      entity: input_boolean.mostra_dettagli_guasti
      name: Dettagli
      icon: mdi:format-list-bulleted
      show_state: false
      show_icon: true
      color: blue
      tap_action:
        action: toggle
  - type: markdown
    content: |-
      {%- set labels = {
        'mancanza_rete': 'Mancanza rete', 'batteria_inefficiente': 'Batteria inefficiente',
        'fusibile_zone': 'Fusibile zone', 'fusibile_i_bus': 'Fusibile I-BUS',
        'linea_telefonica': 'Linea telefonica', 'modulo_gsm': 'Modulo GSM', 'jamming_radio': 'Disturbo radio (jamming)',
        'batteria_sensori_radio': 'Batteria sensori radio', 'perdita_sensori_radio': 'Perdita sensori radio',
        'sabotaggio_centrale': 'Sabotaggio centrale', 'coperchio_centrale': 'Coperchio centrale aperto',
        'sabotaggio_lettori': 'Sabotaggio lettori', 'sabotaggio_tastiere': 'Sabotaggio tastiere',
        'sabotaggio_espansioni': 'Sabotaggio espansioni' } -%}
      {%- set info = { 'manutenzione': 'Manutenzione', 'programmazione': 'Programmazione', 'reset': 'Reset',
        'internet': 'Internet', 'vocale': 'Vocale' } -%}
      {%- set ns = namespace(on=[], info=[]) -%}
      {%- for k, v in labels.items() if is_state('binary_sensor.inim_smartliving_1050_' ~ k, 'on') %}{% set ns.on = ns.on + [v] %}{% endfor -%}
      {%- for k, v in info.items() if is_state('binary_sensor.inim_smartliving_1050_' ~ k, 'on') %}{% set ns.info = ns.info + [v] %}{% endfor -%}
      {%- if ns.on %}⚠️ **{{ ns.on | join(' · ') }}**{% else %}✅ Nessun guasto o sabotaggio della centrale{% endif %}
      {%- if ns.info %}

      ℹ️ {{ ns.info | join(' · ') }}{% endif %}
    grid_options:
      columns: 12
  - color: state
    type: entities
    entities:
    - entity: binary_sensor.inim_smartliving_1050_mancanza_rete
      name: Mancanza rete
    - entity: binary_sensor.inim_smartliving_1050_batteria_inefficiente
      name: Batteria inefficiente
    - entity: binary_sensor.inim_smartliving_1050_fusibile_zone
